<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiTronics • Emoji Tech Quiz</title>
<style>
:root{
  --bg:#070b14;--grid:#152033;--text:#f5f7fb;--muted:#9ba8bd;--muted2:#71809a;
  --card:#0a101d;--border:#29364d;--border2:#26344c;--rule-bg:#0d1524;
  --input-bg:#080e19;--accent:#b9ff3d;--accent-text:#081008;--wrong:#ff7480;
  --shadow:0 25px 80px #0008;--table-head:#0e1727;--row-border:#1d2940;
}
[data-theme="light"]{
  --bg:#f4f6fb;--grid:#e3e8f2;--text:#10161f;--muted:#4a5670;--muted2:#5c6a86;
  --card:#ffffff;--border:#d7dde8;--border2:#dbe1ec;--rule-bg:#eef1f8;
  --input-bg:#f5f7fb;--accent:#5b8c1a;--accent-text:#ffffff;--wrong:#c4293b;
  --shadow:0 15px 45px #0001;--table-head:#eef1f8;--row-border:#e5e9f2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.app{min-height:100vh;padding:22px 5%;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:20px;font:12px monospace;letter-spacing:.12em}
.top-right{display:flex;align-items:center;gap:14px}
.brand:before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin-right:9px;box-shadow:0 0 15px var(--accent)}
.green{color:var(--accent)}
.themeBtn{width:auto;margin:0;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font:12px monospace;letter-spacing:.08em;cursor:pointer}
.center{max-width:720px;margin:70px auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:42px;box-shadow:var(--shadow)}
.eyebrow{color:var(--accent);font:11px monospace;letter-spacing:.18em;margin-bottom:18px}
h1{font-size:clamp(55px,9vw,90px);line-height:.85;letter-spacing:-.07em;margin:0}
h1 span{color:var(--accent)}
.copy{color:var(--muted);font-size:18px;margin:25px 0}
.rules{display:flex;gap:10px;margin:20px 0}
.rule{flex:1;background:var(--rule-bg);border:1px solid var(--border2);padding:14px;border-radius:12px}
.rule b{display:block;font-size:24px}
.rule small{color:var(--muted2)}
input{width:100%;padding:17px;border-radius:11px;border:1px solid var(--border2);background:var(--input-bg);color:var(--text);font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;padding:16px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-text);font-weight:bold;cursor:pointer;font-size:15px}
button:disabled{opacity:.4;cursor:not-allowed}
.link{display:block;text-align:center;color:var(--muted2);text-decoration:none;margin-top:17px;font:12px monospace}
.meta{display:flex;justify-content:space-between;color:var(--muted2);font:12px monospace;margin-bottom:15px}
.progress{height:3px;background:var(--rule-bg);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.question{margin-top:20px}
.qtop{display:flex;justify-content:space-between;align-items:center;color:var(--accent);font:22px monospace;font-weight:bold}
.emoji{text-align:center;font-size:75px;margin:55px 0 25px}
.clue{text-align:center;font-size:20px;line-height:1.5;color:var(--text)}
.feedback{text-align:center;margin-top:18px;padding:16px;font:22px monospace;font-weight:bold}
.wrong{color:var(--wrong)}
.right{color:var(--accent)}
.score{text-align:center;font-size:105px;color:var(--accent);font-weight:bold}
.table{border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-top:25px}
.row{display:grid;grid-template-columns:90px 1fr 100px;padding:17px;border-top:1px solid var(--row-border)}
.row:first-child{border-top:0}
.head{color:var(--muted2);font:11px monospace;background:var(--table-head)}
.row b{text-align:right;color:var(--accent)}
.qr{text-align:center}
.qr img{width:min(400px,80vw);background:white;padding:10px;border-radius:8px;margin:20px auto}
.live{color:#b9ff3d;font:12px monospace;text-align:right}
.err{color:var(--wrong);font:12px monospace;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="app">Loading…</div>

<script>
(function () {
  "use strict";

  // ---- OPTIONAL: shared leaderboard via Supabase -----------------------
  // Leave these blank to use localStorage only (works great for a single
  // Helpdesk laptop). Fill both in to sync scores from every phone.
  var SUPABASE_URL = "";
  var SUPABASE_ANON_KEY = "";
  var useSupabase = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

  // ---- Questions ---------------------------------------------------------
  // Full pool — a random 10 are picked each time someone starts the quiz.
  var Q = [
    ["🐍 + 👨‍💻", "I'm one of the most beginner-friendly programming languages.", "python"],
    ["☁️ + 💻", "Your files can live here without being stored on your laptop.", "cloud computing"],
    ["📷 + 🤖 + 👁️", "I help machines understand what they see.", "computer vision"],
    ["📡 + 📱 + 🌐", "I connect everyday devices so they can communicate over the internet.", "internet of things"],
    ["🧠 + 📊 + 🤖", "I let computers learn patterns from data.", "machine learning"],
    ["🔐 + 🔑 + 💻", "I protect information by turning it into a form outsiders cannot easily read.", "encryption"],
    ["🧠 + ⚡ + 🖥️", "I am the tiny brain that controls many electronic systems.", "microcontroller"],
    ["🌡️ + 📟", "I detect temperature and convert it into a measurable signal.", "temperature sensor"],
    ["🧲 + ⚡ + 📏", "I can sense magnetic fields and am commonly used for position or speed sensing.", "hall effect sensor"],
    ["📶 + 💻 + 🔗", "I allow devices to exchange data without a physical cable.", "wireless communication"],
    ["🔲 + 🧠 + 💻", "I'm a chip that packs an entire circuit onto one piece of silicon.", "integrated circuit"],
    ["📦 + ➡️ + 📦 + ➡️ + 📦", "I move data in small pieces from sender to receiver across a network.", "packet switching"],
    ["👆 + 🔢 + 🔐", "I use a unique physical trait to confirm who you are.", "biometric authentication"],
    ["🔋 + ⚡ + 🔌", "I store electrical energy chemically so devices can run without a wall socket.", "battery"],
    ["🖥️ + 🕹️ + 🌍", "I create a fully simulated environment you can see and move through.", "virtual reality"],
    ["🔗 + 📦 + 🔒", "I'm a growing, tamper-resistant chain of records shared across many computers.", "blockchain"],
    ["🤖 + 💬 + 🧠", "I generate human-like text by predicting the next word.", "large language model"],
    ["📶 + 🏠 + 🔀", "I let multiple devices in your home share one internet connection.", "router"],
    ["🖨️ + 🧱 + 📐", "I build physical objects layer by layer from a digital design.", "3d printing"],
    ["📈 + 🔍 + 💾", "I search through huge amounts of data to find patterns humans would miss.", "data mining"],
    ["🚗 + 🤖 + 🛣️", "I can drive without a human touching the wheel.", "autonomous vehicle"],
    ["🖐️ + 🖥️ + 👆", "I let you control a screen just by touching it.", "touchscreen"],
    ["🌐 + 🕸️ + 🔗", "I'm the system that translates website names into IP addresses.", "dns"],
    ["🔊 + 🎙️ + 🤖", "I convert your spoken words into text a computer can understand.", "speech recognition"]
  ];

  var ALIASES = {
    "cloud computing": ["cloud", "cloud computing"],
    "internet of things": ["internet of things", "iot"],
    "machine learning": ["machine learning", "ml"],
    "microcontroller": ["microcontroller", "micro controller", "mcu"],
    "temperature sensor": ["temperature sensor", "temp sensor"],
    "hall effect sensor": ["hall effect sensor", "hall sensor"],
    "wireless communication": ["wireless communication", "wireless"],
    "integrated circuit": ["integrated circuit", "ic", "chip"],
    "packet switching": ["packet switching", "packet routing"],
    "biometric authentication": ["biometric authentication", "biometrics", "biometric"],
    "virtual reality": ["virtual reality", "vr"],
    "large language model": ["large language model", "llm", "language model"],
    "3d printing": ["3d printing", "3d printer", "additive manufacturing"],
    "data mining": ["data mining", "datamining"],
    "autonomous vehicle": ["autonomous vehicle", "self driving car", "self-driving car"],
    "touchscreen": ["touchscreen", "touch screen"],
    "dns": ["dns", "domain name system"],
    "speech recognition": ["speech recognition", "voice recognition"]
  };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function norm(x) {
    return x.toLowerCase().trim().replace(/[.,!?'"’]/g, "").replace(/\s+/g, " ");
  }
  function isCorrect(x, a) {
    x = norm(x);
    return x === a || (ALIASES[a] || []).includes(x);
  }

  // ---- Score storage -------------------------------------------------
  var LOCAL_KEY = "aitronics-scores";

  function localScores() {
    try {
      var a = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
      return a.sort(function (a, b) { return b.score - a.score || a.seconds - b.seconds; });
    } catch (e) {
      return [];
    }
  }
  function localSave(entry) {
    var a = localScores();
    a.push(entry);
    localStorage.setItem(LOCAL_KEY, JSON.stringify(a.slice(0, 200)));
  }

  function saveScore(entry) {
    if (!useSupabase) { localSave(entry); return Promise.resolve(); }
    return fetch(SUPABASE_URL + "/rest/v1/scores", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ name: entry.name, score: entry.score, seconds: entry.seconds })
    }).catch(function () { localSave(entry); }); // fall back if the request fails
  }

  function fetchScores() {
    if (!useSupabase) return Promise.resolve(localScores());
    return fetch(SUPABASE_URL + "/rest/v1/scores?select=name,score,seconds&order=score.desc,seconds.asc&limit=100", {
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      }
    }).then(function (r) {
      if (!r.ok) throw new Error("bad response");
      return r.json();
    }).catch(function () { return localScores(); });
  }

  // ---- Rendering -------------------------------------------------------
  var appEl = document.getElementById("app");

  var THEME_KEY = "aitronics-theme";

  function getTheme() {
    try { return localStorage.getItem(THEME_KEY) || "dark"; } catch (e) { return "dark"; }
  }
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  function toggleTheme() {
    setTheme(getTheme() === "light" ? "dark" : "light");
  }

  function shell(body) {
    appEl.innerHTML =
      '<div class="app"><div class="top"><span class="brand">AITRONICS</span>' +
      '<div class="top-right"><span>EMOJI TECH QUIZ</span>' +
      '<button class="themeBtn" id="themeToggle" type="button">' +
      (getTheme() === "light" ? "🌙 DARK" : "☀️ LIGHT") + '</button></div></div>' +
      body + '</div>';
    var btn = document.getElementById("themeToggle");
    if (btn) btn.onclick = function () {
      toggleTheme();
      btn.textContent = getTheme() === "light" ? "🌙 DARK" : "☀️ LIGHT";
    };
  }

  function go(path) {
    history.pushState({}, "", path);
    route();
  }

  function home() {
    shell(
      '<div class="center"><div class="card">' +
      '<div class="eyebrow">HELPDESK CHALLENGE / 01</div>' +
      '<h1>DECODE<br><span>THE TECH.</span></h1>' +
      '<p class="copy">Scan. Think. Type the answer. Climb the leaderboard.</p>' +
      '<div class="rules">' +
      '<div class="rule"><b>10</b><small>QUESTIONS</small></div>' +
      '<div class="rule"><b>20s</b><small>PER QUESTION</small></div>' +
      '<div class="rule"><b>15</b><small>SPEED BONUS</small></div>' +
      '</div>' +
      '<input id="name" maxlength="24" placeholder="Enter your name">' +
      '<button id="start">START QUIZ →</button>' +
      '<a class="link" href="/leaderboard" id="lbLink">VIEW LEADERBOARD</a>' +
      '</div></div>'
    );
    document.getElementById("lbLink").onclick = function (e) { e.preventDefault(); go("/leaderboard"); };
    document.getElementById("start").onclick = function () {
      var n = document.getElementById("name").value.trim();
      if (n) runQuiz(n);
    };
    document.getElementById("name").onkeydown = function (e) {
      if (e.key === "Enter") document.getElementById("start").click();
    };
  }

  var QUIZ_LENGTH = 10;

  function runQuiz(name) {
    var quizQ = shuffle(Q).slice(0, Math.min(QUIZ_LENGTH, Q.length));
    var i = 0, score = 0, totalSeconds = 0, timeLeft = 20, timer = null;

    function renderQuestion() {
      var q = quizQ[i];
      shell(
        '<div class="center">' +
        '<div class="meta"><span>' + esc(name.toUpperCase()) + '</span><span>' + (i + 1) + ' / ' + quizQ.length + '</span></div>' +
        '<div class="progress"><i style="width:' + ((i + 1) / quizQ.length * 100) + '%"></i></div>' +
        '<div class="card question">' +
        '<div class="qtop"><span>DECODE IT</span><span id="time">00:20</span></div>' +
        '<div class="emoji">' + q[0] + '</div>' +
        '<p class="clue">\u201C' + esc(q[1]) + '\u201D</p>' +
        '<input id="ans" autocomplete="off" placeholder="Type your answer...">' +
        '<button id="submit">SUBMIT ↗</button>' +
        '<div id="fb"></div>' +
        '</div></div>'
      );
      document.getElementById("ans").focus();
      timeLeft = 20;
      clearInterval(timer);
      timer = setInterval(function () {
        totalSeconds++;
        timeLeft--;
        var t = document.getElementById("time");
        if (t) t.textContent = "00:" + String(Math.max(timeLeft, 0)).padStart(2, "0");
        if (timeLeft <= 0) submit(true);
      }, 1000);
      document.getElementById("submit").onclick = function () { submit(false); };
      document.getElementById("ans").onkeydown = function (e) {
        if (e.key === "Enter") submit(false);
      };
    }

    function submit(timeout) {
      clearInterval(timer);
      var ansInput = document.getElementById("ans");
      var ans = ansInput ? ansInput.value : "";
      var ok = !timeout && isCorrect(ans, quizQ[i][2]);
      var pts = ok ? (timeLeft >= 10 ? 15 : 10) : 0;
      score += pts;
      var fb = document.getElementById("fb");
      if (fb) {
        fb.className = "feedback " + (ok ? "right" : "wrong");
        fb.textContent = ok
          ? "✓ CORRECT +" + pts
          : "✕ " + (timeout ? "TIME'S UP" : "NOT QUITE") + " • " + quizQ[i][2].toUpperCase();
      }
      var submitBtn = document.getElementById("submit");
      if (submitBtn) submitBtn.disabled = true;
      setTimeout(function () {
        i++;
        if (i === quizQ.length) {
          saveScore({ name: name, score: score, seconds: totalSeconds }).then(function () {
            result(score);
          });
        } else {
          renderQuestion();
        }
      }, 1700);
    }

    renderQuestion();
  }

  function result(score) {
    shell(
      '<div class="center"><div class="card" style="text-align:center">' +
      '<div class="eyebrow">QUIZ COMPLETE</div>' +
      '<div class="score">' + score + '</div><p>POINTS</p>' +
      '<button id="toLb">SEE LEADERBOARD →</button>' +
      '<a class="link" href="/" id="again">PLAY AGAIN</a>' +
      '</div></div>'
    );
    document.getElementById("toLb").onclick = function () { go("/leaderboard"); };
    document.getElementById("again").onclick = function (e) { e.preventDefault(); go("/"); };
  }

  var boardInterval = null;

  function board() {
    clearInterval(boardInterval);
    function draw() {
      fetchScores().then(function (a) {
        shell(
          '<div class="center">' +
          '<div class="eyebrow">LIVE / HELP DESK</div>' +
          '<h1 style="font-size:65px">LEADERBOARD</h1>' +
          '<div class="table">' +
          '<div class="row head"><span>RANK</span><span>NAME</span><span>SCORE</span></div>' +
          (a.length
            ? a.map(function (x, idx) {
                var medal = idx < 3 ? ["🥇", "🥈", "🥉"][idx] : (idx + 1);
                return '<div class="row"><span>' + medal + '</span><span>' + esc(x.name) + '</span><b>' + x.score + '</b></div>';
              }).join("")
            : '<div style="padding:40px;text-align:center;color:#71809a">No scores yet.</div>') +
          '</div>' +
          '<a class="link" href="/" id="back">← BACK TO QUIZ</a>' +
          '</div>'
        );
        var back = document.getElementById("back");
        if (back) back.onclick = function (e) { e.preventDefault(); go("/"); };
      });
    }
    draw();
    boardInterval = setInterval(draw, 3000);
  }

  function qr() {
    var url = location.origin + "/";
    shell(
      '<div class="center"><div class="card qr">' +
      '<div class="eyebrow">AITRONICS</div>' +
      '<h1 style="font-size:65px">SCAN TO<br><span>PLAY</span></h1>' +
      '<img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=' + encodeURIComponent(url) + '" alt="QR code to play">' +
      '<p>Scan with your phone camera.</p>' +
      '<button onclick="window.print()">PRINT QR POSTER</button>' +
      '</div></div>'
    );
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function route() {
    clearInterval(boardInterval);
    var path = location.pathname.replace(/\/+$/, "") || "/";
    if (path === "/leaderboard") board();
    else if (path === "/qr") qr();
    else home();
  }

  setTheme(getTheme());
  window.addEventListener("popstate", route);
  route();
})();
</script>
</body>
</html>
